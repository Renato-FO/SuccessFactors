schema_version: '5.1'
name: SuccessFactors | Pessoas-e-Dados-Pessoais | Leitura 02
meta:
  id: wrk_5106e701bfee7f427300683c3efb4d60
  description: Selecione o ambiente global SuccessFactors. Modelos genericos OData v2; ajuste parametros e permissoes
    antes de usar.
collection:
- name: 00 — Autenticacao
  meta:
    id: fld_48c452da22fe21219ba62dea509c62d2
    description: ''
  children:
  - name: Conectar — BTP + SuccessFactors em uma chamada
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_7531a2c9638a6050f4f5c4326224aaf6
      description: Preencha o ambiente global SuccessFactors e selecione-o na coleção. Obtém token BTP e consulta
        a Destination automaticamente. Os tokens ficam disponíveis para todas as coleções que usam esse ambiente
        global.
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: "const data = insomnia.response.json();\nif (!data.access_token) throw new Error('Token BTP\
        \ ausente');\ninsomnia.globals.set('btp_access_token', data.access_token);\nconst service = String(insomnia.variables.get('destination_service_url')\
        \ || '').replace(/\\/$/, '');\nconst name = insomnia.variables.get('destination_name');\nif (!service ||\
        \ !name) throw new Error('Preencha destination_service_url e destination_name');\nconst response = await\
        \ new Promise((resolve, reject) => {\n  insomnia.sendRequest({\n    url: service + '/destination-configuration/v1/destinations/'\
        \ + encodeURIComponent(name),\n    method: 'GET',\n    header: { Authorization: 'Bearer ' + data.access_token,\
        \ Accept: 'application/json' }\n  }, (error, response) => error ? reject(error) : resolve(response));\n\
        });\nif (response.code !== 200) throw new Error('Destination retornou HTTP ' + response.code);\nconst destination\
        \ = response.json();\nconst token = (destination.authTokens || []).find(t => t.value && !t.error);\nif (!token)\
        \ throw new Error('Destination não retornou token utilizável');\ninsomnia.globals.set('access_token', token.value);\n\
        insomnia.test('Token SuccessFactors obtido', () => insomnia.expect(token.value).to.be.a('string').and.not.empty);\n"
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 01 — Token BTP
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_d697bada735a72038ed16fc246690659
      description: 'Service key do Destination Service: url + /oauth/token, clientid e clientsecret.'
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        insomnia.globals.set(''btp_access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 02 — Token SuccessFactors via Destination
    url: '{{ _.destination_service_url }}/destination-configuration/v1/destinations/{{ _.destination_name }}'
    method: GET
    meta:
      id: req_12978c1d7ee114700656eae20e202af9
      description: destination_service_url = uri da service key. Salva automaticamente access_token global.
    authentication:
      type: bearer
      token: '{{ _.btp_access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        const token = (data.authTokens || []).find(t => t.value && !t.error);

        if (!token) throw new Error(''Destination sem token utilizável'');

        insomnia.globals.set(''access_token'', token.value);'
  - name: Alternativa — Token direto SAML
    url: '{{ _.base_url }}/oauth/token'
    method: POST
    meta:
      id: req_1186598f1cbf747da30d5b8a86da6e70
      description: Requer assertion SAML assinada em Base64. sf_company_id é o ID do tenant; sf_client_id é a API
        Key OAuth.
    authentication: {}
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        insomnia.globals.set(''access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: company_id
        value: '{{ _.sf_company_id }}'
        disabled: false
      - name: client_id
        value: '{{ _.sf_client_id }}'
        disabled: false
      - name: grant_type
        value: urn:ietf:params:oauth:grant-type:saml2-bearer
        disabled: false
      - name: assertion
        value: '{{ _.saml_assertion }}'
        disabled: false
- name: PerGlobalInfoJPN
  meta:
    id: fld_0e6cb4746af003471bd7f06e7ac3f618
    description: ''
  children:
  - name: 01 — Listar
    url: '{{ _.base_url }}/odata/v2/PerGlobalInfoJPN'
    method: GET
    meta:
      id: req_3ebd6508f49ad46aefdf316456e6e2f6
      description: 'Chaves: country (Edm.String), personIdExternal (Edm.String), startDate (Edm.DateTime). Execute
        Listar para preencher automaticamente key_PerGlobalInfoJPN. Campos e permissoes podem variar por tenant.'
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters:
    - name: $format
      value: json
      disabled: false
    - name: $top
      value: '{{ _.page_size }}'
      disabled: false
    - name: $skip
      value: '{{ _.skip }}'
      disabled: false
    - name: $select
      value: country,personIdExternal,startDate,createdBy,createdDateTime,createdOn,endDate,genericDate1,genericDate10,genericDate2
      disabled: true
    scripts:
      afterResponse: "const data = insomnia.response.json();\ninsomnia.test('HTTP 200', () => insomnia.expect(insomnia.response.code).to.eql(200));\n\
        const first = data.d && data.d.results && data.d.results[0];\nconst types = {\"country\": \"Edm.String\"\
        , \"personIdExternal\": \"Edm.String\", \"startDate\": \"Edm.DateTime\"};\nif (first && Object.keys(types).length\
        \ && Object.keys(types).every(k => first[k] !== undefined && first[k] !== null)) {\n  const literal = (type,\
        \ value) => {\n    if (type === 'Edm.String') return \"'\" + String(value).replaceAll(\"'\", \"''\") + \"\
        '\";\n    if (type === 'Edm.DateTime' || type === 'Edm.DateTimeOffset') {\n      const m = String(value).match(/^\\\
        /Date\\((-?\\d+)(?:[+-]\\d{4})?\\)\\/$/);\n      const iso = new Date(m ? Number(m[1]) : value).toISOString().replace('.000Z',\
        \ type === 'Edm.DateTime' ? '' : 'Z');\n      return (type === 'Edm.DateTime' ? 'datetime' : 'datetimeoffset')\
        \ + \"'\" + iso + \"'\";\n    }\n    if (type === 'Edm.Guid') return \"guid'\" + value + \"'\";\n    return\
        \ String(value) + ({'Edm.Int64':'L','Edm.Decimal':'M','Edm.Single':'f','Edm.Double':'d'}[type] || '');\n\
        \  };\n  insomnia.environment.set('key_PerGlobalInfoJPN', Object.entries(types).map(([k,t]) => k + '=' +\
        \ literal(t,first[k])).join(','));\n}\nif (data.d && data.d.__next) insomnia.environment.set('next_page_url',\
        \ data.d.__next);\n"
