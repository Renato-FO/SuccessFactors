  - name: 01 — Listar
    url: '{{ _.base_url }}/odata/v2/CertificationContent'
    method: GET
    meta:
      id: req_e08d4b2c64fd3fb97b355ef27d4f0c99
      description: 'Chaves: JobProfile_externalCode (Edm.String), externalCode (Edm.String). Execute Listar para
        preencher automaticamente key_CertificationContent. Campos e permissoes podem variar por tenant.'
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
    headers:
