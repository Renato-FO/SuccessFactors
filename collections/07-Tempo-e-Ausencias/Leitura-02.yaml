    method: GET
    meta:
      id: req_2b40b85a2a7cdeaf12a34646e0b40e55
      description: 'Chaves: externalCode (Edm.String). Execute Listar para preencher automaticamente key_TimeAccountPayoutProfile.
        Campos e permissoes podem variar por tenant.'
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters:
    - &id004
      name: $format
      value: json
      disabled: false
    - name: $top
      value: '{{ _.page_size }}'
      disabled: false
    - name: $skip
      value: '{{ _.skip }}'
      disabled: false
    - name: $select
      value: externalCode,country,createdBy,createdDateTime,entityUUID,externalName_defaultValue,externalName_en_DEBUG,externalName_en_US
      disabled: true
    scripts:
      afterResponse: "const data = insomnia.response.json();\ninsomnia.test('HTTP 200', () => insomnia.expect(insomnia.response.code).to.eql(200));\n\
        const first = data.d && data.d.results && data.d.results[0];\nconst types = {\"externalCode\": \"Edm.String\"\
        };\nif (first && Object.keys(types).length && Object.keys(types).every(k => first[k] !== undefined && first[k]\
        \ !== null)) {\n  const literal = (type, value) => {\n    if (type === 'Edm.String') return \"'\" + String(value).replaceAll(\"\
        '\", \"''\") + \"'\";\n    if (type === 'Edm.DateTime' || type === 'Edm.DateTimeOffset') {\n      const\
        \ m = String(value).match(/^\\/Date\\((-?\\d+)(?:[+-]\\d{4})?\\)\\/$/);\n      const iso = new Date(m ?\
        \ Number(m[1]) : value).toISOString().replace('.000Z', type === 'Edm.DateTime' ? '' : 'Z');\n      return\
        \ (type === 'Edm.DateTime' ? 'datetime' : 'datetimeoffset') + \"'\" + iso + \"'\";\n    }\n    if (type\
        \ === 'Edm.Guid') return \"guid'\" + value + \"'\";\n    return String(value) + ({'Edm.Int64':'L','Edm.Decimal':'M','Edm.Single':'f','Edm.Double':'d'}[type]\
        \ || '');\n  };\n  insomnia.environment.set('key_TimeAccountPayoutProfile', Object.entries(types).map(([k,t])\
        \ => k + '=' + literal(t,first[k])).join(','));\n}\nif (data.d && data.d.__next) insomnia.environment.set('next_page_url',\
        \ data.d.__next);\n"
  - name: 02 — Selecionar campos
    url: '{{ _.base_url }}/odata/v2/TimeAccountPayoutProfile'
    method: GET
    meta:
      id: req_65b4c387719aecb8ac92bb99137cb7fa
      description: 'Chaves: externalCode (Edm.String). Execute Listar para preencher automaticamente key_TimeAccountPayoutProfile.
        Campos e permissoes podem variar por tenant.'
    authentication:
