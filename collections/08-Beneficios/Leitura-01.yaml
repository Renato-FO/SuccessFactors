      disabled: false
    - name: $top
      value: '{{ _.page_size }}'
      disabled: false
    - name: $skip
      value: '{{ _.skip }}'
      disabled: false
    - name: $select
      value: effectiveStartDate,id,amount,amountFromWallet,benefit,benefitDataSource,benefitDataSourceWithExternalCode,benefitEnrollmentEntityID,benefitEntitlementAmount,benefitPaymentOption
      disabled: true
    scripts:
      afterResponse: "const data = insomnia.response.json();\ninsomnia.test('HTTP 200', () => insomnia.expect(insomnia.response.code).to.eql(200));\n\
        const first = data.d && data.d.results && data.d.results[0];\nconst types = {\"effectiveStartDate\": \"\
        Edm.DateTime\", \"id\": \"Edm.String\"};\nif (first && Object.keys(types).length && Object.keys(types).every(k\
        \ => first[k] !== undefined && first[k] !== null)) {\n  const literal = (type, value) => {\n    if (type\
        \ === 'Edm.String') return \"'\" + String(value).replaceAll(\"'\", \"''\") + \"'\";\n    if (type === 'Edm.DateTime'\
        \ || type === 'Edm.DateTimeOffset') {\n      const m = String(value).match(/^\\/Date\\((-?\\d+)(?:[+-]\\\
        d{4})?\\)\\/$/);\n      const iso = new Date(m ? Number(m[1]) : value).toISOString().replace('.000Z', type\
        \ === 'Edm.DateTime' ? '' : 'Z');\n      return (type === 'Edm.DateTime' ? 'datetime' : 'datetimeoffset')\
        \ + \"'\" + iso + \"'\";\n    }\n    if (type === 'Edm.Guid') return \"guid'\" + value + \"'\";\n    return\
        \ String(value) + ({'Edm.Int64':'L','Edm.Decimal':'M','Edm.Single':'f','Edm.Double':'d'}[type] || '');\n\
        \  };\n  insomnia.environment.set('key_BenefitEnrollment', Object.entries(types).map(([k,t]) => k + '='\
        \ + literal(t,first[k])).join(','));\n}\nif (data.d && data.d.__next) insomnia.environment.set('next_page_url',\
        \ data.d.__next);\n"
