        key_BenefitEnrollment. Campos e permissoes podem variar por tenant.'
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters:
    - &id026
      name: $format
