type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: SuccessFactors | Beneficios | Leitura 02
meta:
  id: wrk_59a42ee2efa73f593905c637799c11ea
  description: Selecione o ambiente global SuccessFactors. Modelos genericos OData v2; ajuste parametros e permissoes
    antes de usar.
collection:
- name: 00 — Autenticacao
  meta:
    id: fld_54170ff690acf93e343afecff6a2393e
    description: ''
  children:
  - name: Conectar — BTP + SuccessFactors em uma chamada
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_6d4d92a87e2e062a4fa2b258aaea89ed
      description: Preencha o ambiente global SuccessFactors e selecione-o na coleção. Obtém token BTP e consulta
        a Destination automaticamente. Os tokens ficam disponíveis para todas as coleções que usam esse ambiente
        global.
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: "const localUrl = insomnia.environment.get('base_url') || insomnia.baseEnvironment.get('base_url');\n\
        const globalUrl = insomnia.globals.get('base_url') || insomnia.baseGlobals.get('base_url');\nconst tokenStore\
        \ = localUrl || !globalUrl ? insomnia.environment : insomnia.globals;\nconst data = insomnia.response.json();\n\
        if (!data.access_token) throw new Error('Token BTP ausente');\ntokenStore.set('btp_access_token', data.access_token);\n\
        const service = String(insomnia.variables.get('destination_service_url') || '').replace(/\\/$/, '');\nconst\
        \ name = insomnia.variables.get('destination_name');\nif (!service || !name) throw new Error('Preencha destination_service_url\
        \ e destination_name');\nconst response = await new Promise((resolve, reject) => {\n  insomnia.sendRequest({\n\
        \    url: service + '/destination-configuration/v1/destinations/' + encodeURIComponent(name),\n    method:\
        \ 'GET',\n    header: { Authorization: 'Bearer ' + data.access_token, Accept: 'application/json' }\n  },\
        \ (error, response) => error ? reject(error) : resolve(response));\n});\nif (response.code !== 200) throw\
        \ new Error('Destination retornou HTTP ' + response.code);\nconst destination = response.json();\nconst\
        \ token = (destination.authTokens || []).find(t => t.value && !t.error);\nif (!token) throw new Error('Destination\
        \ não retornou token utilizável');\ntokenStore.set('access_token', token.value);\ninsomnia.test('Token SuccessFactors\
        \ obtido', () => insomnia.expect(token.value).to.be.a('string').and.not.empty);\n"
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 01 — Token BTP
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_0f1d754ff925538d2f1409efa03a5688
      description: 'Service key do Destination Service: url + /oauth/token, clientid e clientsecret.'
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const localUrl = insomnia.environment.get(''base_url'') || insomnia.baseEnvironment.get(''base_url'');

        const globalUrl = insomnia.globals.get(''base_url'') || insomnia.baseGlobals.get(''base_url'');

        const tokenStore = localUrl || !globalUrl ? insomnia.environment : insomnia.globals;

        const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        tokenStore.set(''btp_access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 02 — Token SuccessFactors via Destination
    url: '{{ _.destination_service_url }}/destination-configuration/v1/destinations/{{ _.destination_name }}'
    method: GET
    meta:
      id: req_382d64a9095f3cfe8abcdc5b58aab196
      description: destination_service_url = uri da service key. Salva automaticamente access_token global.
    authentication:
      type: bearer
      token: '{{ _.btp_access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters: []
    scripts:
      afterResponse: 'const localUrl = insomnia.environment.get(''base_url'') || insomnia.baseEnvironment.get(''base_url'');

        const globalUrl = insomnia.globals.get(''base_url'') || insomnia.baseGlobals.get(''base_url'');

        const tokenStore = localUrl || !globalUrl ? insomnia.environment : insomnia.globals;

        const data = insomnia.response.json();

        const token = (data.authTokens || []).find(t => t.value && !t.error);

        if (!token) throw new Error(''Destination sem token utilizável'');

        tokenStore.set(''access_token'', token.value);'
  - name: Alternativa — Token direto SAML
    url: '{{ _.base_url }}/oauth/token'
    method: POST
    meta:
      id: req_652e7550cd4b5ca7642054a7ee196212
      description: Requer assertion SAML assinada em Base64. sf_company_id é o ID do tenant; sf_client_id é a API
        Key OAuth.
    authentication: {}
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const localUrl = insomnia.environment.get(''base_url'') || insomnia.baseEnvironment.get(''base_url'');

        const globalUrl = insomnia.globals.get(''base_url'') || insomnia.baseGlobals.get(''base_url'');

        const tokenStore = localUrl || !globalUrl ? insomnia.environment : insomnia.globals;

        const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        tokenStore.set(''access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: company_id
        value: '{{ _.sf_company_id }}'
        disabled: false
      - name: client_id
        value: '{{ _.sf_client_id }}'
        disabled: false
      - name: grant_type
        value: urn:ietf:params:oauth:grant-type:saml2-bearer
        disabled: false
      - name: assertion
        value: '{{ _.saml_assertion }}'
        disabled: false
