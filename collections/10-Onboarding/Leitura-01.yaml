        \ || '');\n  };\n  insomnia.environment.set('key_ComplianceDocumentFlow', Object.entries(types).map(([k,t])\
        \ => k + '=' + literal(t,first[k])).join(','));\n}\nif (data.d && data.d.__next) insomnia.environment.set('next_page_url',\
        \ data.d.__next);\n"
