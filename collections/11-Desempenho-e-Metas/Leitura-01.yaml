    url: '{{ _.base_url }}/odata/v2/SimpleGoal'
    method: GET
    meta:
      id: req_147ffcfc8d824941ece4f400f2cdc436
      description: 'Chaves: id (Edm.Int64). Execute Listar para preencher automaticamente key_SimpleGoal. Campos
