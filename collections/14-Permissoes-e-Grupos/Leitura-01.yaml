type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: SuccessFactors | Permissoes-e-Grupos | Leitura 01
meta:
  id: wrk_659c6ca53d011b1841beb8a7448eaa72
  description: Selecione o ambiente global SuccessFactors. Modelos genericos OData v2; ajuste parametros e permissoes
    antes de usar.
collection:
- name: 00 — Autenticacao
  meta:
    id: fld_c1b93991c7120fff75a36d7e2b418775
    description: ''
  children:
  - name: Conectar — BTP + SuccessFactors em uma chamada
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_c0520361a805455caa8983559c4f14cf
      description: Preencha o ambiente global SuccessFactors e selecione-o na coleção. Obtém token BTP e consulta
        a Destination automaticamente. Os tokens ficam disponíveis para todas as coleções que usam esse ambiente
        global.
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: "const data = insomnia.response.json();\nif (!data.access_token) throw new Error('Token BTP\
        \ ausente');\ninsomnia.globals.set('btp_access_token', data.access_token);\nconst service = String(insomnia.variables.get('destination_service_url')\
        \ || '').replace(/\\/$/, '');\nconst name = insomnia.variables.get('destination_name');\nif (!service ||\
        \ !name) throw new Error('Preencha destination_service_url e destination_name');\nconst response = await\
        \ new Promise((resolve, reject) => {\n  insomnia.sendRequest({\n    url: service + '/destination-configuration/v1/destinations/'\
        \ + encodeURIComponent(name),\n    method: 'GET',\n    header: { Authorization: 'Bearer ' + data.access_token,\
        \ Accept: 'application/json' }\n  }, (error, response) => error ? reject(error) : resolve(response));\n\
        });\nif (response.code !== 200) throw new Error('Destination retornou HTTP ' + response.code);\nconst destination\
        \ = response.json();\nconst token = (destination.authTokens || []).find(t => t.value && !t.error);\nif (!token)\
        \ throw new Error('Destination não retornou token utilizável');\ninsomnia.globals.set('access_token', token.value);\n\
        insomnia.test('Token SuccessFactors obtido', () => insomnia.expect(token.value).to.be.a('string').and.not.empty);\n"
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 01 — Token BTP
    url: '{{ _.btp_token_url }}'
    method: POST
    meta:
      id: req_cce4184c0d9d0c97d718b5e099057041
      description: 'Service key do Destination Service: url + /oauth/token, clientid e clientsecret.'
    authentication:
      type: basic
      username: '{{ _.btp_client_id }}'
      password: '{{ _.btp_client_secret }}'
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        insomnia.globals.set(''btp_access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: grant_type
        value: client_credentials
        disabled: false
  - name: 02 — Token SuccessFactors via Destination
    url: '{{ _.destination_service_url }}/destination-configuration/v1/destinations/{{ _.destination_name }}'
    method: GET
    meta:
      id: req_1e7d6da457b7f1b4ad9eb4b340cc2d90
      description: destination_service_url = uri da service key. Salva automaticamente access_token global.
    authentication:
      type: bearer
      token: '{{ _.btp_access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        const token = (data.authTokens || []).find(t => t.value && !t.error);

        if (!token) throw new Error(''Destination sem token utilizável'');

        insomnia.globals.set(''access_token'', token.value);'
  - name: Alternativa — Token direto SAML
    url: '{{ _.base_url }}/oauth/token'
    method: POST
    meta:
      id: req_3c5f2dd1542cdac5a1459dd0231aa43d
      description: Requer assertion SAML assinada em Base64. sf_company_id é o ID do tenant; sf_client_id é a API
        Key OAuth.
    authentication: {}
    headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    parameters: []
    scripts:
      afterResponse: 'const data = insomnia.response.json();

        if (!data.access_token) throw new Error(''Token ausente na resposta'');

        insomnia.globals.set(''access_token'', data.access_token);'
    body:
      mimeType: application/x-www-form-urlencoded
      params:
      - name: company_id
        value: '{{ _.sf_company_id }}'
        disabled: false
      - name: client_id
        value: '{{ _.sf_client_id }}'
        disabled: false
      - name: grant_type
        value: urn:ietf:params:oauth:grant-type:saml2-bearer
        disabled: false
      - name: assertion
        value: '{{ _.saml_assertion }}'
        disabled: false
- name: DGField
  meta:
    id: fld_82376b1ac06fe727fdeb13ac06e93077
    description: ''
  children:
  - name: 01 — Listar
    url: '{{ _.base_url }}/odata/v2/DGField'
    method: GET
    meta:
      id: req_0c13a7083c30a441947dbb0935f603d3
      description: 'Chaves: name (Edm.String). Execute Listar para preencher automaticamente key_DGField. Campos
        e permissoes podem variar por tenant.'
