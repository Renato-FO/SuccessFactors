  - name: 04 — Filtrar
    url: '{{ _.base_url }}/odata/v2/DGField'
    method: GET
    meta:
      id: req_8133b607fc3ef98fb57c9a22e241191a
      description: Substitua REPLACE_ME e os valores de exemplo. Use literais OData adequados ao tipo.
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
