    method: GET
    meta:
      id: req_92cbd4eed813759f7ca6e54403641625
      description: 'Chaves: name (Edm.String). Execute Listar para preencher automaticamente key_DGField. Campos
        e permissoes podem variar por tenant.'
    authentication:
      type: bearer
      token: '{{ _.access_token }}'
      prefix: Bearer
    headers:
    - name: Accept
      value: application/json
    parameters:
    - name: $format
      value: json
      disabled: false
    - name: $top
      value: '{{ _.page_size }}'
      disabled: false
    - name: $select
      value: name,dataType,label,picklistId
      disabled: false
  - name: 03 — Buscar por chave
    url: '{{ _.base_url }}/odata/v2/DGField({{ _.key_DGField }})'
    method: GET
    meta:
      id: req_6bde7fdc38c461619fffbe0a52aa3a15
      description: 'Chaves: name (Edm.String). Execute Listar para preencher automaticamente key_DGField. Campos
        e permissoes podem variar por tenant.'
