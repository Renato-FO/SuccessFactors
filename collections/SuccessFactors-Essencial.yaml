    - name: $top
      value: '{{ _.page_size }}'
      disabled: false
    - name: $select
      value: userId,addressLine1,addressLine2,addressLine3,assignmentUUID,benchStrength,bonusBudgetAmount,bonusTarget,businessPhone
      disabled: false
  - name: 03 — Buscar por chave
    url: '{{ _.base_url }}/odata/v2/User({{ _.key_User }})'
    method: GET
    meta:
      id: req_68be0a1855e2f57f33dfb4cef4ff92d1
