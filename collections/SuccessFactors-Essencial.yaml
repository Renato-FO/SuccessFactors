    headers:
    - name: Accept
      value: application/json
    parameters:
    - name: $format
      value: json
      disabled: false
  - name: 04 — Filtrar
    url: '{{ _.base_url }}/odata/v2/User'
    method: GET
    meta:
      id: req_bd3c3b7d93eb09811f5057385b37df48
      description: Substitua REPLACE_ME e os valores de exemplo. Use literais OData adequados ao tipo.
    authentication:
      type: bearer
